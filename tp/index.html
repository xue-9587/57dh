    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            menuToggle.addEventListener('click', function() {
                navLinks.classList.toggle('active');
            });
            
            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="fa fa-arrow-circle-up"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });
            
            // 图片圆角生成器功能
            const fileInput = document.getElementById('file-input');
            const uploadArea = document.querySelector('.upload-area');
            const previewImage = document.getElementById('preview-image');
            const previewPlaceholder = document.querySelector('.preview-placeholder');
            const radiusSlider = document.getElementById('radius-slider');
            const radiusValue = document.getElementById('radius-value');
            const resetButton = document.getElementById('reset-button');
            const downloadButton = document.getElementById('download-button');
            
            // 上传区域点击触发文件选择
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 处理文件选择
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        previewImage.src = event.target.result;
                        previewImage.style.borderRadius = `${radiusSlider.value}px`;
                        previewPlaceholder.style.display = 'none';
                        previewImage.style.display = 'block';
                        downloadButton.disabled = false;
                        downloadButton.classList.remove('disabled');
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // 拖拽功能
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.boxShadow = 'inset 3px 3px 6px rgba(160, 174, 192, 0.4), inset -3px -3px 6px rgba(255, 255, 255, 0.8)';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.boxShadow = '3px 3px 6px rgba(160, 174, 192, 0.4), -3px -3px 6px rgba(255, 255, 255, 0.8)';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.boxShadow = '3px 3px 6px rgba(160, 174, 192, 0.4), -3px -3px 6px rgba(255, 255, 255, 0.8)';
                
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        previewImage.src = event.target.result;
                        previewImage.style.borderRadius = `${radiusSlider.value}px`;
                        previewPlaceholder.style.display = 'none';
                        previewImage.style.display = 'block';
                        downloadButton.disabled = false;
                        downloadButton.classList.remove('disabled');
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // 圆角调整
            radiusSlider.addEventListener('input', () => {
                radiusValue.textContent = `${radiusSlider.value}px`;
                if (previewImage.src) {
                    previewImage.style.borderRadius = `${radiusSlider.value}px`;
                }
            });
            
            // 重置功能
            resetButton.addEventListener('click', () => {
                fileInput.value = '';
                previewImage.src = '';
                previewImage.style.display = 'none';
                previewPlaceholder.style.display = 'block';
                radiusSlider.value = 10;
                radiusValue.textContent = '10px';
                downloadButton.disabled = true;
                downloadButton.classList.add('disabled');
            });
            
            // 下载功能
            downloadButton.addEventListener('click', () => {
                if (!previewImage.src) return;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = () => {
                    // 设置canvas尺寸
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // 创建圆角路径
                    const radius = parseInt(radiusSlider.value);
                    ctx.beginPath();
                    ctx.moveTo(radius, 0);
                    ctx.arcTo(canvas.width, 0, canvas.width, canvas.height, radius);
                    ctx.arcTo(canvas.width, canvas.height, 0, canvas.height, radius);
                    ctx.arcTo(0, canvas.height, 0, 0, radius);
                    ctx.arcTo(0, 0, canvas.width, 0, radius);
                    ctx.closePath();
                    
                    ctx.clip();
                    ctx.drawImage(img, 0, 0);
                    
                    // 创建下载链接
                    const link = document.createElement('a');
                    link.download = 'rounded-image.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
                
                img.src = previewImage.src;
            });
        });
    </script>
