        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能（增加容错，避免电脑端报错）
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
            
            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="fa fa-arrow-circle-up"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });
        });
    </script>

                + '?locale=zh-CN&country=CN&allowCountries=CN';

            // 数据源列表：直连优先，CORS 被拦截时依次回退到公共代理
            // （若你的站点部署在自己服务器，建议自建同域代理，更稳定、无第三方依赖）
            var SOURCES = [
                EPIC_API,
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(EPIC_API),
                'https://corsproxy.io/?url=' + encodeURIComponent(EPIC_API)
            ];

            function fetchJson(url) {
                return fetch(url, { headers: { 'Accept': 'application/json' } })
                    .then(function (res) {
                        if (!res.ok) { throw new Error('网络响应异常 ' + res.status); }
                        return res.json();
                    });
            }

            // 依次尝试多个数据源，直到拿到可用 JSON
            function fetchFromSources(index) {
                index = index || 0;
                if (index >= SOURCES.length) {
                    throw new Error('所有数据源均不可用（可能为网络或跨域限制）');
                }
                return fetchJson(SOURCES[index]).catch(function () {
                    return fetchFromSources(index + 1);
                });
            }

            function getLink(el) {
                var slug = '';
                if (el.catalogNs && el.catalogNs.mappings && el.catalogNs.mappings[0]) {
                    slug = el.catalogNs.mappings[0].pageSlug || '';
                }
                if (!slug && el.offerMappings && el.offerMappings[0]) {
                    slug = el.offerMappings[0].pageSlug || '';
                }
                if (!slug) {
                    slug = el.productSlug || el.urlSlug || '';
                }
                if (slug) {
                    return 'https://store.epicgames.com/zh-CN/p/' + slug;
                }
                return 'https://store.epicgames.com/zh-CN/free-games';
            }

            // 判断某游戏在指定时间是否为“当前限时免费”
            function isFreeNow(el, now) {
                var promos = el && el.promotions && el.promotions.promotionalOffers;
                var price = el && el.price && el.price.totalPrice;
                if (!promos || !promos.length || !price) {
                    return false;
                }
                if (price.discountPrice !== 0 || price.originalPrice <= 0) {
                    return false;
                }
                return promos.some(function (po) {
                    return (po.promotionalOffers || []).some(function (o) {
                        var start = new Date(o.startDate).getTime();
                        var end = new Date(o.endDate).getTime();
                        return now >= start && now <= end;
                    });
                });
            }

            // 获取“即将限免”的最近开始时间（仅限 discountPercentage===0 且 start>now）
            function getUpcomingFreeStart(el, now) {
                var promos = el && el.promotions && el.promotions.upcomingPromotionalOffers;
                if (!promos || !promos.length) { return null; }
                var best = null;
                promos.forEach(function (g) {
                    (g.promotionalOffers || []).forEach(function (o) {
                        var ds = o.discountSetting || {};
                        if (ds.discountPercentage !== 0) { return; } // 仅“完全免费”才算限免，过滤 20%/50% 等折扣
                        var start = new Date(o.startDate).getTime();
                        if (isNaN(start) || start <= now) { return; }
                        if (best === null || start < best) { best = start; }
                    });
                });
                return best;
            }

            // 本地时间格式化：M月D日 HH:mm
            function fmtDate(ts) {
                var d = new Date(ts);
                var pad = function (n) { return (n < 10 ? '0' : '') + n; };
                return (d.getMonth() + 1) + '月' + d.getDate() + '日 '
                    + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }

            function esc(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function buildCard(el, status, startTs) {
                var images = el.keyImages || [];
                var img = images.find(function (i) { return i.type === 'OfferImageWide'; })
                    || images.find(function (i) { return i.type === 'Thumbnail'; })
                    || images[0];
                var imgUrl = img ? img.url : '';
                var title = el.title || '未知游戏';
                var desc = el.description || '';
                var fmt = (el.price && el.price.totalPrice && el.price.totalPrice.fmtPrice) || {};
                var original = fmt.originalPrice || '';
                var current = fmt.discountPrice || '';
                var link = getLink(el);

                var imgHtml = imgUrl
                    ? '<img class="epic-card-img" src="' + esc(imgUrl) + '" alt="' + esc(title) + '" loading="lazy">'
                    : '';

                var badgeHtml = (status === 'soon')
                    ? '<span class="epic-badge soon">即将限免</span>'
                    : '<span class="epic-badge now">免费领取</span>';

                var priceHtml;
                if (status === 'soon') {
                    var curTxt = current ? ('现价 ' + esc(current)) : '';
                    var dateTxt = startTs ? (fmtDate(startTs) + ' 开放') : '';
                    priceHtml = '<div class="epic-soon-date">'
                        + (curTxt ? '<span>' + curTxt + '</span>' : '')
                        + (dateTxt ? '<span><i class="fa-regular fa-clock"></i> ' + dateTxt + '领取</span>' : '')
                        + '</div>';
                } else {
                    var origHtml = original
                        ? '<span class="epic-price-original">' + esc(original) + '</span>'
                        : '';
                    priceHtml = '<div class="epic-card-price">' + origHtml
                        + '<span class="epic-price-free">免费</span></div>';
                }

                var btnTxt = (status === 'soon') ? '查看详情 ' : '前往领取 ';

                return ''
                    + '<div class="epic-card">'
                    +   imgHtml
                    +   '<div class="epic-card-body">'
                    +     badgeHtml
                    +     '<div class="epic-card-title">' + esc(title) + '</div>'
                    +     '<div class="epic-card-desc">' + esc(desc) + '</div>'
                    +     priceHtml
                    +     '<a class="epic-card-btn" href="' + esc(link) + '" target="_blank" rel="noopener">' + btnTxt + '<i class="fa-solid fa-arrow-right"></i></a>'
                    +   '</div>'
                    + '</div>';
            }

            // 渲染一个分组（小标题 + 网格）
            function renderGroup(icon, title, items) {
                if (!items.length) { return ''; }
                var cards = items.map(function (it) {
                    return buildCard(it.el, it.status, it.start);
                }).join('');
                return '<h3 class="epic-subtitle"><i class="' + icon + '"></i> '
                    + esc(title) + ' <span class="count">(' + items.length + ')</span></h3>'
                    + '<div class="epic-grid">' + cards + '</div>';
            }

            function loadEpicFreeGames() {
                var content = document.getElementById('epicContent');
                var refreshBtn = document.getElementById('epicRefresh');
                if (!content) { return; }
                if (refreshBtn) { refreshBtn.disabled = true; }

                content.innerHTML = '<div class="epic-loading"><div class="epic-spinner"></div>'
                    + '<p>正在获取 Epic 最新免费游戏...</p></div>';

                fetchFromSources(0)
                    .then(function (data) {
                        var elements = (data && data.data && data.data.Catalog
                            && data.data.Catalog.searchStore
                            && data.data.Catalog.searchStore.elements) || [];
                        var now = Date.now();

                        var currentList = [];
                        var soonList = [];

                        elements.forEach(function (el) {
                            if (isFreeNow(el, now)) {
                                currentList.push({ el: el, status: 'now' });
                            } else {
                                var start = getUpcomingFreeStart(el, now);
                                if (start !== null) {
                                    soonList.push({ el: el, status: 'soon', start: start });
                                }
                            }
                        });

                        // 当前可领为空时，回退到“含折扣且当前价为 0”的游戏
                        if (!currentList.length) {
                            currentList = elements.filter(function (el) {
                                var price = el.price && el.price.totalPrice;
                                return price && price.discountPrice === 0
                                    && price.originalPrice > 0
                                    && el.promotions && el.promotions.promotionalOffers
                                    && el.promotions.promotionalOffers.length;
                            }).map(function (el) { return { el: el, status: 'now' }; });
                        }

                        // 即将限免按开始时间升序
                        soonList.sort(function (a, b) { return a.start - b.start; });

                        if (!currentList.length && !soonList.length) {
                            content.innerHTML = '<div class="epic-empty"><p>'
                                + '<i class="fa-solid fa-gamepad"></i> 当前没有可领取的限时免费游戏，过几天再来看看吧～</p></div>';
                            return;
                        }

                        var html = renderGroup('fa-solid fa-gift', '当前可免费领取', currentList)
                            + renderGroup('fa-solid fa-hourglass-half', '即将限免', soonList);
                        content.innerHTML = html;
                    })
                    .catch(function (err) {
                        content.innerHTML = '<div class="epic-error"><p><i class="fa-solid fa-triangle-exclamation"></i> '
                            + '获取失败：' + esc(err.message) + '</p>'
                            + '<p style="font-size:0.85rem;margin-top:8px;">可能是网络限制或接口跨域（CORS）拦截，请点击右上角“刷新”稍后重试。</p></div>';
                    })
                    .then(function () {
                        if (refreshBtn) { refreshBtn.disabled = false; }
                    });
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadEpicFreeGames();
                var refreshBtn = document.getElementById('epicRefresh');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', loadEpicFreeGames);
                }
            });
        })();
    </script>
</body>
</html>
