    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            menuToggle.addEventListener('click', function() {
                navLinks.classList.toggle('active');
            });
            
            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="bi bi-rocket-fill"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });
            
            // ICO生成器功能
            const fileInput = document.getElementById('file-input');
            const uploadArea = document.querySelector('.upload-area');
            const previewBox = document.querySelector('.preview-box');
            const previewImage = document.querySelector('.preview-image');
            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            const statusMessage = document.querySelector('.status-message');
            const sizeSelect = document.getElementById('size-select');
            const formatSelect = document.getElementById('format-select');
            
            let originalImage = null;
            
            // 触发文件选择
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 处理文件选择
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            originalImage = img;
                            previewImage.src = event.target.result;
                            previewBox.style.display = 'block';
                            showStatus('图片已加载，请设置参数并生成ICO', 'success');
                            downloadBtn.disabled = true;
                        };
                        img.src = event.target.result;
                    };
                    
                    reader.readAsDataURL(file);
                }
            });
            
            // 生成ICO按钮点击事件
            generateBtn.addEventListener('click', () => {
                if (!originalImage) {
                    showStatus('请先上传图片', 'error');
                    return;
                }
                
                try {
                    // 获取用户选择的尺寸
                    const size = parseInt(sizeSelect.value);
                    const format = formatSelect.value;
                    
                    // 创建Canvas处理图像
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    // 绘制图像（保持比例居中裁剪）
                    const scale = Math.max(size / originalImage.width, size / originalImage.height);
                    const scaledWidth = originalImage.width * scale;
                    const scaledHeight = originalImage.height * scale;
                    const x = (size - scaledWidth) / 2;
                    const y = (size - scaledHeight) / 2;
                    
                    ctx.drawImage(
                        originalImage,
                        x, y,
                        scaledWidth, scaledHeight
                    );
                    
                    // 更新预览
                    previewImage.src = canvas.toDataURL(`image/${format}`);
                    
                    // 准备下载
                    downloadBtn.disabled = false;
                    downloadBtn.onclick = () => {
                        const link = document.createElement('a');
                        link.download = `favicon.${format}`;
                        link.href = canvas.toDataURL(`image/${format}`);
                        link.click();
                    };
                    
                    showStatus(`已成功生成 ${size}x${size} ${format.toUpperCase()} 图标`, 'success');
                } catch (error) {
                    showStatus('生成图标失败: ' + error.message, 'error');
                    console.error(error);
                }
            });
            
            // 显示状态消息
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message ' + type;
                statusMessage.style.display = 'block';
                
                // 3秒后自动隐藏
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 3000);
            }
        });
    </script>
