    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能（增加容错，避免电脑端报错）
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
            
            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="bi bi-rocket-fill"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });
        });
    </script>

    <!-- 留言板交互逻辑：数据只走服务端 ly_api.php，不写 localStorage / 不写本机 -->
    <script type="text/javascript">
        (function () {
            var API = 'https://57dh.cc.cd/ly_api.php';
            var form    = document.getElementById('msgForm');
            var nameEl  = document.getElementById('msgName');
            var contentEl = document.getElementById('msgContent');
            var countEl = document.getElementById('msgCount');
            var statusEl = document.getElementById('msgStatus');
            var listEl  = document.getElementById('msgList');
            var submitEl = document.getElementById('msgSubmit');

            if (!form) return; // 容错

            // HTML 转义，防止 XSS
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function setStatus(text, type) {
                statusEl.textContent = text || '';
                statusEl.className = 'msg-status' + (type ? ' ' + type : '');
            }

            // 字数统计
            contentEl.addEventListener('input', function () {
                countEl.textContent = contentEl.value.length + '/500';
            });

            // 渲染留言列表
            function renderMessages(list) {
                if (!list || !list.length) {
                    listEl.innerHTML = '<div class="msg-empty">暂无留言，来抢沙发吧～</div>';
                    return;
                }
                listEl.innerHTML = list.map(function (m) {
                    return '<div class="msg-item">' +
                        '<div class="msg-item-head">' +
                            '<span class="msg-item-name">' + escapeHtml(m.name) + '</span>' +
                            '<span class="msg-item-time">' + escapeHtml(m.time) + '</span>' +
                        '</div>' +
                        '<div class="msg-item-body">' + escapeHtml(m.content) + '</div>' +
                    '</div>';
                }).join('');
            }

            // 拉取留言（服务端）
            function loadMessages() {
                fetch(API, { cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data && data.ok && Array.isArray(data.list)) {
                            renderMessages(data.list);
                        } else {
                            listEl.innerHTML = '<div class="msg-empty">暂无留言，来抢沙发吧～</div>';
                        }
                    })
                    .catch(function () {
                        listEl.innerHTML = '<div class="msg-empty">留言加载失败，请确认 ly_api.php 已部署到服务器</div>';
                    });
            }

            // 提交留言
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var name = nameEl.value.trim();
                var content = contentEl.value.trim();
                if (!name || !content) {
                    setStatus('昵称和留言内容都不能为空', 'err');
                    return;
                }
                submitEl.disabled = true;
                setStatus('提交中…', '');
                fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, content: content })
                })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    submitEl.disabled = false;
                    if (data && data.ok) {
                        form.reset();
                        countEl.textContent = '0/500';
                        setStatus('留言成功，感谢你的留言！', 'ok');
                        loadMessages();
                    } else {
                        setStatus((data && data.msg) ? data.msg : '提交失败，请重试', 'err');
                    }
                })
                .catch(function () {
                    submitEl.disabled = false;
                    setStatus('网络错误，提交失败', 'err');
                });
            });

            // 首次加载
            loadMessages();
        })();
    </script>
