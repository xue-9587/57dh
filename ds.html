    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能（增加容错，避免电脑端报错）
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }

            // 打赏金额选择
            const rewardAmounts = document.querySelectorAll('.reward-amount[data-amount]');
            const rewardInput = document.querySelector('.reward-custom input');
            rewardAmounts.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    rewardAmounts.forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    if (btn.dataset.amount !== 'custom' && rewardInput) {
                        rewardInput.value = '';
                    }
                });
            });
            if (rewardInput) {
                rewardInput.addEventListener('input', function() {
                    rewardAmounts.forEach(function(b) {
                        if (b.dataset.amount === 'custom') {
                            b.classList.add('active');
                        } else {
                            b.classList.remove('active');
                        }
                    });
                });
            }

            // 打赏弹窗
            const rewardModal = document.getElementById('rewardModal');
            const rewardPayBtn = document.getElementById('rewardPayBtn');
            const rewardModalClose = document.getElementById('rewardModalClose');
            const rewardModalMask = document.getElementById('rewardModalMask');
            const rewardModalAmount = document.getElementById('rewardModalAmount');
            const rewardQrBox = document.getElementById('rewardQrBox');
            const rewardQrLabel = document.getElementById('rewardQrLabel');
            const rewardTabs = document.querySelectorAll('.reward-tab');

            function getSelectedAmount() {
                const active = document.querySelector('.reward-amount.active');
                if (active && active.dataset.amount !== 'custom') {
                    return active.dataset.amount;
                }
                if (rewardInput && rewardInput.value.trim() !== '') {
                    return rewardInput.value.trim();
                }
                return '';
            }

            function openRewardModal() {
                rewardModalAmount.textContent = '¥' + (getSelectedAmount() || '0');
                rewardModal.classList.add('show');
            }

            function closeRewardModal() {
                rewardModal.classList.remove('show');
            }

            if (rewardPayBtn) {
                rewardPayBtn.addEventListener('click', openRewardModal);
            }
            if (rewardModalClose) {
                rewardModalClose.addEventListener('click', closeRewardModal);
            }
            if (rewardModalMask) {
                rewardModalMask.addEventListener('click', closeRewardModal);
            }

            rewardTabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    rewardTabs.forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    if (tab.dataset.pay === 'wechat') {
                        rewardQrBox.innerHTML = '<img src="/img/wx.png" alt="微信收款二维码">';
                        rewardQrLabel.textContent = '微信扫码支付';
                    } else {
                        rewardQrBox.innerHTML = '<img src="/img/zfb.png" alt="支付宝收款二维码">';
                        rewardQrLabel.textContent = '支付宝扫码支付';
                    }
                });
            });
            
            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="bi bi-rocket-fill"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });
        });
    </script>
