    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能（增加容错，避免电脑端报错）
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }

            // 最新限免游戏（Epic 接口，经代理 https://57dh.cc.cd/epic_free_games.php 获取，已带 CORS 头）
            (function initFreeGames() {
                const grid = document.getElementById('fgGrid');
                const refreshBtn = document.getElementById('fgRefresh');
                if (!grid) return;

                function esc(s) {
                    return String(s == null ? '' : s)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }

                function fmtDate(iso) {
                    if (!iso) return '';
                    const d = new Date(iso);
                    if (isNaN(d.getTime())) return '';
                    const p = function (n) { return (n < 10 ? '0' : '') + n; };
                    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
                }

                const IMG_ORDER = ['Thumbnail', 'OfferImageWide', 'DieselStoreFrontWide',
                    'VaultOpened', 'TakeoverVaultWide', 'ProductPageImage'];
                function pickImage(images) {
                    if (!images || !images.length) return '';
                    for (let i = 0; i < IMG_ORDER.length; i++) {
                        const m = images.find(function (x) { return x.type === IMG_ORDER[i]; });
                        if (m && m.url) return m.url;
                    }
                    return images[0].url || '';
                }

                function getOffer(el, kind) {
                    const promos = el.promotions;
                    if (!promos) return null;
                    const list = kind === 'now' ? promos.promotionalOffers : promos.upcomingPromotionalOffers;
                    if (!list || !list.length) return null;
                    const inner = list[0].promotionalOffers;
                    if (!inner || !inner.length) return null;
                    const setting = inner[0].discountSetting;
                    // 限免 = 折扣百分比为 0（即 100% off，价格归零）
                    if (!setting || setting.discountPercentage !== 0) return null;
                    return inner[0];
                }

                function gameUrl(el) {
                    if (el.url) return el.url;
                    try {
                        const m = el.catalogNs && el.catalogNs.mappings && el.catalogNs.mappings[0];
                        if (m && m.pageSlug) return 'https://store.epicgames.com/zh-CN/p/' + m.pageSlug;
                    } catch (e) {}
                    if (el.productSlug) return 'https://store.epicgames.com/zh-CN/p/' + el.productSlug;
                    return '';
                }

                function renderItem(el, kind) {
                    const offer = getOffer(el, kind);
                    if (!offer) return '';
                    const img = pickImage(el.keyImages);
                    const cover = img
                        ? '<div class="fg-cover"><img src="' + esc(img) + '" loading="lazy" alt="' + esc(el.title) + '"></div>'
                        : '<div class="fg-cover"><span class="fg-noimg">无封面</span></div>';
                    const badge = kind === 'now'
                        ? '<span class="fg-badge free">限免中</span>'
                        : '<span class="fg-badge soon">即将限免</span>';
                    const period = '限免时间：' + fmtDate(offer.startDate) + ' ~ ' + fmtDate(offer.endDate);
                    const url = gameUrl(el);
                    const link = url
                        ? '<a class="fg-link" href="' + esc(url) + '" target="_blank" rel="noopener">前往领取</a>'
                        : '';
                    return '' +
                        '<div class="fg-item">' +
                            cover +
                            '<div class="fg-info">' +
                                '<div class="fg-title">' + esc(el.title) + '</div>' +
                                '<div class="fg-period">' + esc(period) + '</div>' +
                                '<div class="fg-bottom">' + badge + link + '</div>' +
                            '</div>' +
                        '</div>';
                }

                function render(data) {
                    try {
                        const els = data.data.Catalog.searchStore.elements;
                        const now = [];
                        const soon = [];
                        els.forEach(function (el) {
                            if (getOffer(el, 'now')) now.push(el);
                            else if (getOffer(el, 'soon')) soon.push(el);
                        });
                        const ordered = now.concat(soon);
                        if (!ordered.length) {
                            grid.innerHTML = '<div class="fg-loading">当前没有正在限免或即将限免的游戏 🙂</div>';
                            return;
                        }
                        grid.innerHTML = ordered.map(function (el) {
                            return renderItem(el, getOffer(el, 'now') ? 'now' : 'soon');
                        }).join('');
                    } catch (e) {
                        grid.innerHTML = '<div class="fg-error">数据解析失败：' + esc(e.message) + '</div>';
                    }
                }

                function load() {
                    grid.innerHTML = '<div class="fg-loading"><i class="bi bi-hourglass-split"></i> 正在获取 Epic 限免游戏…</div>';
                    fetch('https://57dh.cc.cd/epic.php', { cache: 'no-store' })
                        .then(function (r) {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        })
                        .then(render)
                        .catch(function (err) {
                            grid.innerHTML = '<div class="fg-error">' +
                                '<i class="bi bi-exclamation-triangle"></i> 获取失败：' + esc(err.message) +
                                '<br>请确认代理可访问。</div>';
                        });
                }

                if (refreshBtn) refreshBtn.addEventListener('click', load);
                load();
            })();

            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="bi bi-rocket-fill"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });
        });
    </script>
