            let currentMusicIndex = 0;

            audio.volume = 0.7;

            // 更新播放器信息
            function updatePlayerInfo(music) {
                songTitle.textContent = music.title;
                songArtist.textContent = music.artist;
                audio.src = music.url;
            }
            
            // 播放/暂停切换
            function togglePlayPause() {
                if (audio.paused) {
                    audio.play();
                    playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                } else {
                    audio.pause();
                    playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                }
            }
            
            // 更新进度条
            function updateProgress() {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
                
                // 更新时间显示
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
                if (audio.duration) {
                    durationDisplay.textContent = formatTime(audio.duration);
                }
            }
            
            // 格式化时间为分:秒
            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                seconds = Math.floor(seconds % 60);
                return `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
            }
            
            // 跳转到指定进度
            function seekTo(e) {
                const progressWidth = progressContainer.clientWidth;
                const clickPosition = e.offsetX;
                const seekTime = (clickPosition / progressWidth) * audio.duration;
                audio.currentTime = seekTime;
            }
            
            // 播放上一首
            function playPrevious() {
                currentMusicIndex = (currentMusicIndex - 1 + musicList.length) % musicList.length;
                updatePlayerInfo(musicList[currentMusicIndex]);
                audio.play();
                playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                updateMusicButtons();
            }
            
            // 播放下一首
            function playNext() {
                currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
                updatePlayerInfo(musicList[currentMusicIndex]);
                audio.play();
                playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                updateMusicButtons();
            }
            
            // 更新音乐按钮状态
            function updateMusicButtons() {
                if (!musicButtons) return;
                musicButtons.forEach((btn, index) => {
                    if (index === currentMusicIndex) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
            
            // 音量控制函数
            function setVolume(value) {
                const volume = value / 100;
                audio.volume = volume;
                lastVolume = volume; // 更新最后一次音量
                updateVolumeIcon();
            }
            
            // 切换静音状态
            function toggleMute() {
                if (audio.volume > 0) {
                    lastVolume = audio.volume; // 保存当前音量
                    audio.volume = 0;
                    volumeSlider.value = 0;
                } else {
                    audio.volume = lastVolume; // 恢复上次音量
                    volumeSlider.value = lastVolume * 100;
                }
                updateVolumeIcon();
            }
            
            // 更新音量图标
            function updateVolumeIcon() {
                if (audio.volume === 0) {
                    volumeIcon.innerHTML = '<i class="bi bi-volume-mute"></i>';
                } else if (audio.volume < 0.5) {
                    volumeIcon.innerHTML = '<i class="bi bi-volume-down"></i>';
                } else {
                    volumeIcon.innerHTML = '<i class="bi bi-volume-up"></i>';
                }
            }
            
            // 事件监听
            playPauseBtn?.addEventListener('click', togglePlayPause);
            prevBtn?.addEventListener('click', playPrevious);
            nextBtn?.addEventListener('click', playNext);
            audio.addEventListener('timeupdate', updateProgress);
            progressContainer?.addEventListener('click', seekTo);
            
            // 音量控制事件
            volumeSlider?.addEventListener('input', function() {
                setVolume(this.value);
            });
            
            volumeIcon?.addEventListener('click', toggleMute);
            
            // 音乐结束时自动播放下一首
            audio.addEventListener('ended', playNext);
            
            // 初始化第一个音乐
            updatePlayerInfo(musicList[currentMusicIndex]);
            
            // 动态生成音乐按钮
            const musicGrid = document.querySelector('.music-grid');
            if (musicGrid) {
                musicGrid.innerHTML = ''; // 清空原有内容
                musicList.forEach((music, index) => {
                    const button = document.createElement('button');
                    button.className = 'music-button';
                    button.textContent = music.title;
                    button.addEventListener('click', function() {
                        // 更新全局索引并播放
                        currentMusicIndex = index;
                        updatePlayerInfo(musicList[currentMusicIndex]);
                        audio.play();
                        playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                        updateMusicButtons();
                    });
                    musicGrid.appendChild(button);
                });
                // 获取生成后的音乐按钮
                musicButtons = document.querySelectorAll('.music-button');
                // 初始化音乐按钮状态
                updateMusicButtons();
