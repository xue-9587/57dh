    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 导航菜单切换功能
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            // 修复：增加判断，避免移动端菜单按钮不存在时报错
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
            
            // 返回顶部功能增强
            const backToTopButton = document.createElement('div');
            backToTopButton.className = 'back-to-top hide';
            backToTopButton.innerHTML = '<i class="bi bi-rocket-fill"></i>';
            document.body.appendChild(backToTopButton);
            
            // 滚动事件监听
            let lastScrollTop = 0;
            const scrollThreshold = 200;
            
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > scrollThreshold && scrollTop > lastScrollTop) {
                    backToTopButton.classList.remove('hide');
                    backToTopButton.classList.add('show');
                } else if (scrollTop <= scrollThreshold || scrollTop < lastScrollTop - 50) {
                    backToTopButton.classList.remove('show');
                    backToTopButton.classList.add('hide');
                }
                
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                const scrollToTop = () => {
                    const position = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (position > 0) {
                        window.requestAnimationFrame(scrollToTop);
                        window.scrollTo(0, position - Math.max(20, position / 10));
                    }
                };
                
                scrollToTop();
            });

            // 图片瀑布流和弹窗功能
            const modal = document.createElement('div');
            modal.className = 'image-modal';
            // 弹窗结构增加文字展示区域
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close-modal"><i class="fa fa-times"></i></span>
                    <span class="modal-prev"><i class="fa fa-chevron-left"></i></span>
                    <div class="modal-img-container">
                        <img class="modal-img" src="" alt="图片预览">
                    </div>
                    <div class="modal-caption"></div> <!-- 文字内容区域 -->
                    <span class="modal-next"><i class="fa fa-chevron-right"></i></span>
                </div>
            `;
            document.body.appendChild(modal);

            const modalImg = modal.querySelector('.modal-img');
            const modalCaption = modal.querySelector('.modal-caption'); // 获取文字容器
            const closeBtn = modal.querySelector('.close-modal');
            const prevBtn = modal.querySelector('.modal-prev');
            const nextBtn = modal.querySelector('.modal-next');
            const images = document.querySelectorAll('.masonry-img');
            let currentIndex = 0;

            // 打开弹窗 - 同时显示文字内容
            images.forEach((img, index) => {
                img.addEventListener('click', () => {
                    modalImg.src = img.src;
                    // 获取图片的描述文字并显示
                    modalCaption.textContent = img.dataset.caption || '图片展示';
                    currentIndex = index;
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });

            // 关闭弹窗
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            });

            // 点击弹窗外部关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });

            // 上一张图片 - 同步更新文字
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                modalImg.src = images[currentIndex].src;
                modalCaption.textContent = images[currentIndex].dataset.caption || '图片展示';
            });

            // 下一张图片 - 同步更新文字
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentIndex = (currentIndex + 1) % images.length;
                modalImg.src = images[currentIndex].src;
                modalCaption.textContent = images[currentIndex].dataset.caption || '图片展示';
            });

            // 键盘导航 - 同步更新文字
            document.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('active')) return;
                
                if (e.key === 'Escape') {
                    modal.classList.remove('active');
                    document.body.style.overflow = '';
                } else if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    modalImg.src = images[currentIndex].src;
                    modalCaption.textContent = images[currentIndex].dataset.caption || '图片展示';
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % images.length;
                    modalImg.src = images[currentIndex].src;
                    modalCaption.textContent = images[currentIndex].dataset.caption || '图片展示';
                }
            });
        });
    </script>
